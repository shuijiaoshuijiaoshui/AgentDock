<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线客服 · 商家经营助手</title>
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-head"><span class="brand-dot"></span><b>在线客服</b></div>
    <div class="side-list" id="side-list">
      <div class="empty">加载中…</div>
    </div>
    <div class="side-foot">
      <button class="btn-ghost" id="history-btn">历史会话</button>
    </div>
  </aside>

  <main class="main">
    <div class="appbar">
      <div>
        <div class="title">商家经营助手</div>
        <div class="sub" id="status">正在连接…</div>
      </div>
      <span class="spacer"></span>
      <button class="icon-btn" id="side-toggle">会话</button>
      <button class="icon-btn" id="logout-link">退出</button>
    </div>

    <div class="idbar">
      <span>当前身份：<b id="who">未登录</b></span>
      <span class="badge ai" id="state-badge">AI</span>
      <span class="link" id="handoff-btn">转人工</span>
    </div>

    <div class="quick" id="quick">
      <button class="chip-btn" data-quick="orders">我的订单</button>
      <button class="chip-btn" data-quick="recon">对账查询</button>
      <button class="chip-btn" data-quick="invoice">开票进度</button>
      <button class="chip-btn" data-quick="aftersale">售后申请</button>
    </div>

    <div class="chat" id="chat">
      <div class="loading">正在加载会话…</div>
    </div>

    <div class="notice hidden" id="closed-notice">会话已结束，如需继续请新建会话。</div>
    <div class="error-box hidden" id="error-box">
      <span id="error-text"></span><button class="retry-btn" id="retry-btn">重试</button>
    </div>

    <div class="attach-previews hidden" id="attach-previews"></div>
    <div class="tip-line">
      试试：<code>查询 SKU-A001 的商品详情</code> · <code>我的订单</code> · <code>退款进度</code>
    </div>
    <div class="composer">
      <div class="tools">
        <button class="icon-round" id="attach-btn" title="上传凭证">＋</button>
        <input type="file" id="file-input" accept="image/png,image/jpeg,application/pdf,image/webp" class="hidden">
      </div>
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="btn-primary send-btn" id="send-btn">发送</button>
    </div>
  </main>
</div>

<!-- 历史会话抽屉 -->
<div class="drawer hidden" id="history-drawer">
  <div class="drawer-panel">
    <div class="drawer-head">
      <span class="title">历史会话</span>
      <span class="link" id="history-close">关闭</span>
    </div>
    <div class="drawer-body" id="history-list"><div class="empty">加载中…</div></div>
    <div class="drawer-foot">
      <button class="btn-ghost" id="history-more">加载更多</button>
    </div>
  </div>
</div>

<!-- 登录浮层 -->
<div class="login" id="login">
  <div class="login-card">
    <h3>客户登录</h3>
    <label for="tenant">租户</label>
    <select id="tenant">
      <option value="t_demo">演示商家（t_demo）</option>
      <option value="t_other">第二租户（t_other）</option>
    </select>
    <label for="username">账号</label>
    <input id="username" value="customer" autocomplete="username">
    <label for="password">密码</label>
    <input id="password" type="password" value="demo123" autocomplete="current-password">
    <button class="btn-primary" id="login-btn">登录</button>
    <div class="login-error hidden" id="login-error"></div>
    <div class="hint">演示账号：customer / demo123（第二租户：customer2 / demo123）</div>
  </div>
</div>

<script type="module" src="static/customer.js"></script>
</body>
</html>
