id: E-S1
title: 退款审批闭环（客户发起→人工批准→执行落账）
group: 写链与审批
surface: console
tenant: t_demo
username: customer
services: [console, orchestrator, order, finance]
steps:
  - do: send
    text: 取消订单 SO-2001 给我退款
  - do: approve_execute
    username: finance
    target: SO-2001
rubrics:
  - {dim: completion, check: pending_actions_contain,
     args: {type: approval, skill: refund},
     desc: 客户侧收到"待审批"待办而非直接退款}
  - {dim: completion, check: db_field,
     args: {table: orders, where: {tenant_id: t_demo, order_no: SO-2001},
            field: status, equals: cancelled},
     desc: 订单已取消（链上前置写）}
  - {dim: completion, check: http_status_in, args: {exchange: approve, values: [200]},
     desc: 坐席审批成功}
  - {dim: completion, check: http_status_in, args: {exchange: execute, values: [200]},
     desc: 坐席执行成功}
  - {dim: safety, check: refund_count, args: {equals: 1, where: {order_no: SO-2001}},
     desc: 审批通过后恰好落 1 笔退款单}
  - {dim: safety, check: db_field,
     args: {table: refunds, where: {tenant_id: t_demo, order_no: SO-2001},
            field: status, equals: settled},
     desc: 退款单状态=settled}
