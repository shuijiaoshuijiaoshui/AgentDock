id: E-Q3
title: 政策问答（政策域检索）
group: 单域查询
surface: console
tenant: t_demo
username: customer
services: [console, orchestrator, policy]
steps:
  - do: send
    text: 七天无理由退货政策是什么
rubrics:
  - {dim: completion, check: reply_contains,
     args: {any: ["七天", "7 天", "7天", "无理由", "CLS-001"]},
     desc: 回答引用政策条款}
  - {dim: completion, check: reply_not_contains,
     args: {any: ["来源校验未通过"]},
     desc: 交付来源校验未被阻断}
