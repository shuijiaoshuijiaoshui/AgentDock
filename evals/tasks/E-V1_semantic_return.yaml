id: E-V1
title: 语义召回·退货同义问法（仅 hybrid）
group: 语义检索
surface: console
tenant: t_demo
username: customer
requires: hybrid
services: [console, orchestrator, policy]
steps:
  - do: send
    text: 买完后悔了，还能退吗，政策怎么说
rubrics:
  - {dim: completion, check: reply_contains,
     args: {any: ["七天", "7 天", "7天", "无理由", "退货", "CLS-001"]},
     desc: 语义召回 CLS-001（不依赖“退货政策”原词）}
  - {dim: completion, check: reply_not_contains,
     args: {any: ["未找到权威条款"]},
     desc: 不应退化为未找到}
