id: E-V2
title: 语义召回·保修同义问法（仅 hybrid）
group: 语义检索
surface: console
tenant: t_demo
username: customer
requires: hybrid
services: [console, orchestrator, aftersale, policy, merchandising]
steps:
  - do: send
    text: 机器坏了，保修政策还管吗
rubrics:
  - {dim: completion, check: reply_contains,
     args: {any: ["CLS-002", "保修", "12 个月", "12个月"]},
     desc: 召回整机保修条款}
  - {dim: completion, check: reply_not_contains,
     args: {any: ["未找到权威条款"]},
     desc: 不应退化为未找到}
