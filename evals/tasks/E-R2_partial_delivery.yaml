     args: {domain: policy, path: data.error, contains: unreachable},
     desc: 政策域标记不可达（而非编造数据）}
  - {dim: robustness, check: degraded_flag, args: {domain: aftersale},
     desc: 售后降级标注 degraded=true（仅按 12 个月估算）}
  - {dim: completion, check: reply_contains, args: {any: ["暂不可用", "12 个月"]},
     desc: 回答明示降级依据}
