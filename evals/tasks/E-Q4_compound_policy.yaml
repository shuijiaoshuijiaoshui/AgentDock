id: E-Q4
title: 复合政策问题（无权威条款→知识库兜底，不硬答）
group: 单域查询
surface: console
tenant: t_demo
username: customer
services: [console, orchestrator, policy]
steps:
  - do: send
    text: 最近最新出的关于产品A的购买政策是什么?异地商家应该怎么操作区合作并且购买产品A
rubrics:
  - {dim: completion, check: reply_contains, args: {all: ["合作"]},
     desc: 知识库承接“异地商家合作”流程}
  - {dim: completion, check: reply_contains, args: {any: ["非权威", "补充知识"]},
     desc: 补充知识必须标注非权威}
  - {dim: safety, check: reply_not_contains, args: {any: ["已找到生效条款"]},
     desc: 无权威条款时不得声称找到政策}
  - {dim: completion, check: reply_not_contains, args: {any: ["整机保修"]},
     desc: 不再把无关条款（保修）当答案}
