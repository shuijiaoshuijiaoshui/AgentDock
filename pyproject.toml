[project]
name = "agentdock"
version = "0.1.0"
description = "AgentDock — 企业级 A2A 商家经营智能体中台（M1 骨架：一主编排 + 商品域真实现 + 五桩域）"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server,signing]>=1.2,<2",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.32",
    "cryptography>=50.0.2",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-api>=1.45.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
