# AgentDock 客服（console）反向代理示例
#
# 目标：商家后台用自己的域名提供 /support/* 入口，客服页、静态资源、API、
# WebSocket 全部由同一个 console 服务（:8307）提供，保持「同源」——
# Cookie 登录 + CSRF 双提交 + WS 鉴权都依赖同源，不要拆成跨域 iframe。
#
# 前端已支持部署前缀：静态资源用相对路径，API/WS 由模块 URL 自动推断
# `/static/` 之前的路径（见 console/static/js/api.js 的 BASE）。
# 因此 /support/ 下无需改写 HTML/JS。
#
# 生产要点：
# - 仅暴露 console；orchestrator/六域/securityd 走内网，不开公网端口。
# - TLS 终止在 nginx；console 设置 ENV=prod 后 Cookie 名为 __Secure-*，
#   且 Path 与这里的 location 前缀一致（默认 /support）。
# - 如果改挂到根路径 /，把 ENV=prod 的 COOKIE_PATH 配成 /。
# - 不要在 nginx 里加 Access-Control-Allow-Origin；同源是设计前提。

upstream agentdock_console {
    server 127.0.0.1:8307;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name merchant.example.com;

    ssl_certificate     /etc/ssl/certs/merchant.example.com.pem;
    ssl_certificate_key /etc/ssl/private/merchant.example.com.key;

    # 演示 portal（可选）：/support/portal 打开「在线客服」入口壳
    location = /support/portal {
        proxy_pass http://agentdock_console/portal;
        include /etc/nginx/snippets/agentdock_proxy_common.conf;
    }

    # 客户侧会话页（工作台 / 不要暴露在商家域，走内网或独立运维域名）
    location = /support/customer {
        proxy_pass http://agentdock_console/customer;
        include /etc/nginx/snippets/agentdock_proxy_common.conf;
    }

    # WebSocket（必须转发 Upgrade/Connection）
    location /support/ws/ {
        proxy_pass http://agentdock_console/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 静态资源 / REST API
    location /support/static/ {
        proxy_pass http://agentdock_console/static/;
        include /etc/nginx/snippets/agentdock_proxy_common.conf;
        expires 1h;
    }
    location /support/api/ {
        proxy_pass http://agentdock_console/api/;
        include /etc/nginx/snippets/agentdock_proxy_common.conf;
        client_max_body_size 12m;   # 与附件 10MB 上限匹配
    }
}

# /etc/nginx/snippets/agentdock_proxy_common.conf:
#
# proxy_http_version 1.1;
# proxy_set_header Host $host;
# proxy_set_header X-Real-IP $remote_addr;
# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_set_header X-Forwarded-Host $host;
# proxy_read_timeout 90s;
#
# 注意：
# 1) 不要在反代层删除 console 返回的 CSP / X-Frame-Options 头；
#    customer 页需要 frame-ancestors 'self' 才能被 /support/portal 同源内嵌。
# 2) 如果必须使用独立子域（support.example.com），把本 server 的 location
#    前缀去掉即可；届时客服页与商家后台不同源，浏览器会把 iframe 当跨站，
#    SameSite=Lax 的 Cookie 不会随 iframe 请求发送，因此不推荐内嵌，
#    请改用 window.open 独立窗口（portal 已提供该形态）。
